# EXP-02 最小部署清单（单文件，便于本地 apply）
# 结构：Namespace → MySQL(Secret+Deployment+PVC+Service) → order-api(Deployment+Service)
---
apiVersion: v1
kind: Namespace
metadata:
  name: order-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: order-lab
type: Opaque
stringData:
  # 实验环境内联密钥；生产或多人环境应改用外部 Secret 管理。
  MYSQL_ROOT_PASSWORD: flash-root
  MYSQL_DATABASE: flash
  MYSQL_USER: flash
  MYSQL_PASSWORD: flash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: order-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
# 建表（GORM AutoMigrate）与种子数据由 order-api 启动时执行（internal/store/mysql），
# 避免 MySQL 镜像初始化脚本与应用代码两处维护同一份 schema。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      # mysql:8.0 官方镜像需以 root 启动；安全加固（最小权限/非 root）在 EXP-15 安全发布实验中处理。
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-secret, key: MYSQL_ROOT_PASSWORD}}
            - name: MYSQL_DATABASE
              valueFrom: {secretKeyRef: {name: mysql-secret, key: MYSQL_DATABASE}}
            - name: MYSQL_USER
              valueFrom: {secretKeyRef: {name: mysql-secret, key: MYSQL_USER}}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-secret, key: MYSQL_PASSWORD}}
          ports: [{containerPort: 3306}]
          readinessProbe:
            exec:
              command: ["bash", "-c", "mysqladmin ping -h 127.0.0.1 -uflash -pflash"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            # EXP-09 重估：事件链路（Outbox 同事务 + Relay 轮询/标记 + Consumer 消费）
            # 使 1 核 limit 在 2000 QPS 混合负载下 CPU 饱和（实测 1.0 核打满，
            # 引发连接池排队与 readyz 超时）。提至 2 核，预算重估见 EXP-09 报告。
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: order-lab
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
---
# EXP-07：Redis 查询缓存（Cache Aside）。单实例、内存有界（allkeys-lru），
# 纯缓存可重建，不挂 PVC；Redis 不可用时应用降级为无缓存模式。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--save"
            - ""
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: order-lab
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
# EXP-09：Kafka 单实例（KRaft，无 ZooKeeper）。单 Broker 故障保障边界见 EXP-09 报告；
# 本实验不声称 Kafka 高可用（EXP-17 才验证）。日志目录挂 PVC，Broker 重启不丢消息。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: order-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-hs
  namespace: order-lab
spec:
  clusterIP: None
  selector: {app: kafka}
  ports: [{port: 9093, targetPort: 9093, name: controller}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: order-lab
spec:
  serviceName: kafka-hs
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            # KRaft 单节点：同一进程承担 broker+controller。
            # controller.quorum.voters 用 headless DNS（kafka-0.kafka-hs），重启后可重连。
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.order-lab.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-hs.order-lab.svc.cluster.local:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # 固定 cluster.id（22 字符 base64）：首次启动自动 format，重启保持同一集群
            - name: KAFKA_CLUSTER_ID
              value: "AAAAAAAAAAAAAAAAAAAAAA"
            # EXP-10 磁盘/保留期预算：24h 或 1.5GiB（低于 PVC 2Gi），先到先删最老段。
            # 与 Outbox 积压高水位共同构成「积压不能无限增长」的双重预算。
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1610612736"
            # 禁止自动建主题：主题必须由 relay 按 KAFKA_PARTITIONS 显式创建
            #（否则 consumer 先连时 broker 按默认 1 分区自动创建，EXP-10 实测踩坑）
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # 单机实验档控制内存占用（默认 -Xmx1G 会压爆 Rancher Desktop）。
            # EXP-09 实测：512m 堆 + 1Gi limit 被 OOM kill（Exit 137）3 次，
            # 未 flush 日志丢失。堆提至 768m、limit 提至 2Gi。
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx768m -Xms384m"
          ports:
            - {containerPort: 9092, name: client}
            - {containerPort: 9093, name: controller}
          readinessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          # liveness 只判「进程是否存活」，不能在高负载下误杀：EXP-10 实测回放
          # 12 万事件时 broker-api-versions 响应 >5s，kubelet SIGTERM（Exit 143）
          # 反复重启。放宽超时与失败阈值（存活判定交给更宽松的口径）。
          livenessProbe:
            exec:
              command:
                - /opt/kafka/bin/kafka-broker-api-versions.sh
                - --bootstrap-server=localhost:9092
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            # EXP-09 实测 1Gi 下 OOM kill（Exit 137）导致未 flush 日志丢失
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - name: kafka-data
              # apache/kafka:3.9.0 的 KRaft 默认日志目录是 /tmp/kafka-logs
              #（EXP-09 曾误挂 /tmp/kraft-combined-logs，数据落在容器层随 Pod 销毁丢失）
              mountPath: /tmp/kafka-logs
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: order-lab
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092, name: client}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-api}
  template:
    metadata:
      labels: {app: order-api}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: order-api
          # 本地构建镜像；同 tag 重建时 k8s 可能复用旧镜像，改 tag 后重新 apply
          image: order-api:exp12b
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              value: "flash:flash@tcp(mysql.order-lab.svc.cluster.local:3306)/flash?parseTime=true&timeout=2s&readTimeout=2s&writeTimeout=2s"
            # EXP-05 实验 B：GOMAXPROCS=2 配合 1000m limit（I/O 密集负载 1 核 2 线程）
            - name: GOMAXPROCS
              value: "2"
            # EXP-06 连接池甜点位（ADR-012）
            - name: DB_MAX_OPEN_CONNS
              value: "25"
            - name: DB_MAX_IDLE_CONNS
              value: "10"
            # EXP-07 缓存（Cache Aside）：Redis 不可用时降级为无缓存
            - name: REDIS_ADDR
              value: "redis.order-lab.svc.cluster.local:6379"
            - name: REDIS_TIMEOUT
              value: "100ms"
            # EXP-08 实测：4000 QPS 下 PoolSize 20 被耗尽（GET 错误率 12.7%），
            # 触发 stale 降级；池大小保持有界，扩容到 128 消除人为瓶颈（见报告场景 A 初测）。
            - name: REDIS_POOL_SIZE
              value: "128"
            - name: CACHE_ENABLED
              value: "true"
            - name: CACHE_TTL
              value: "60s"
            - name: NEG_CACHE_TTL
              value: "5s"
            # EXP-08 有界回源：请求合并、回源并发/等待/超时上限、旧值降级。
            # 回源并发 12 < DB 连接池 25，为下单写路径保留预算（EXP-06 连接预算表）。
            - name: CACHE_COALESCE_ENABLED
              value: "true"
            - name: BACKFILL_MAX_CONCURRENCY
              value: "12"
            - name: BACKFILL_ACQUIRE_TIMEOUT
              value: "200ms"
            - name: BACKFILL_TIMEOUT
              value: "1s"
            - name: STALE_MAX_ENTRIES
              value: "1024"
            - name: STALE_TTL
              value: "60s"
            # EXP-10 积压反压：PENDING 超过水位时下单被明确拒绝（503 backlog_limited）
            - name: OUTBOX_BACKLOG_LIMIT
              value: "200000"
            # EXP-11 准入控制与时间预算：
            #   RATE_LIMIT_RPS=1500 单实例令牌桶（> 下单 200 TPS 常态，< 单实例 ~2000 req/s 容量，
            #   在容量之上留出余量，过载时有明确 429 反馈）；BURST=300 允许短突发。
            #   MAX_INFLIGHT=200 在途硬上限（无排队，超过即 503 overloaded）。
            #   读/写总时间预算：读 500ms（SLO 200ms 的 2.5 倍），写 1s（SLO 500ms 的 2 倍）。
            #   对照实验开关：任一设为 0 即关闭该防线。
            - name: RATE_LIMIT_RPS
              value: "1500"
            - name: RATE_LIMIT_BURST
              value: "300"
            - name: MAX_INFLIGHT
              value: "200"
            - name: READ_BUDGET
              value: "500ms"
            - name: WRITE_BUDGET
              value: "1s"
            # EXP-12 非关键依赖（商品附加信息）：资源隔离 + 熔断 + 降级。
            # 依赖调用独立超时 200ms（写路径 1s 总预算的子预算）、并发/连接上限 8、
            # 有界等待 50ms；连续失败 5 次熔断 10s（半开探测并发 1）。
            # 对照实验：DEP_ISOLATION=false 关闭隔离与熔断，DEP_POOL_SIZE=0 取消并发上限。
            - name: DEP_SIM_ADDR
              value: "http://dep-sim.order-lab.svc.cluster.local:8090"
            - name: DEP_TIMEOUT
              value: "200ms"
            - name: DEP_POOL_SIZE
              value: "8"
            - name: DEP_ACQUIRE_TIMEOUT
              value: "50ms"
            - name: DEP_ISOLATION
              value: "true"
            - name: DEP_CB_FAIL_THRESHOLD
              value: "5"
            - name: DEP_CB_OPEN_DURATION
              value: "10s"
          ports: [{containerPort: 8080}, {containerPort: 2112, name: metrics}]
          startupProbe:
            httpGet: {path: /readyz, port: 8080}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            # EXP-13 校准：requests 从 100m 提至 1 核——100m 只是 EXP-02 的调度占位，
            # HPA 利用率目标（70% × requests）因此失真（0.07 核/副本，见 EXP-13 报告）。
            # 实测本应用每副本在 1000 rps 混合负载下约 1 核，requests 应反映真实用量。
            requests: {cpu: "1", memory: 64Mi}
            # EXP-09 重估：下单路径新增 Outbox 固定开销（uuid+序列化+INSERT）后，
            # 2000 QPS 混合负载下 1 核 limit 打满（实测 0.999 核，引发全链路排队）。
            # 提至 2 核；GOMAXPROCS=2 保持（EXP-05 冻结），预算重估见 EXP-09 报告。
            limits: {cpu: "2", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: order-lab
  labels:
    app: order-api
spec:
  selector: {app: order-api}
  ports:
    - {port: 8080, targetPort: 8080, name: http}
    - {port: 2112, targetPort: 2112, name: metrics}
---
# EXP-09：outbox-relay（Outbox → Kafka）。单副本；Kafka 不可用时事件保持 PENDING 积压，
# 下单不受影响（Outbox 与订单同事务提交），Kafka 恢复后自动排空。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: outbox-relay}
  template:
    metadata:
      labels: {app: outbox-relay}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: outbox-relay
          image: outbox-relay:exp10a
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              value: "flash:flash@tcp(mysql.order-lab.svc.cluster.local:3306)/flash?parseTime=true&timeout=2s&readTimeout=2s&writeTimeout=2s"
            - name: RELAY_DB_MAX_OPEN_CONNS
              value: "4"
            - name: RELAY_DB_MAX_IDLE_CONNS
              value: "2"
            - name: KAFKA_BROKERS
              value: "kafka.order-lab.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "orders"
            # EXP-10：3 分区（固定），分区 key=event_id hash
            - name: KAFKA_PARTITIONS
              value: "3"
            # EXP-09 实测：batch 100 + 500ms 轮询 = 200 msg/s 上限，与 200 TPS 下单
            # 恰好平衡，队列堆积致投递延迟持续增长；batch 200 + 200ms = 1000 msg/s。
            - name: RELAY_BATCH_SIZE
              value: "200"
            - name: RELAY_POLL_INTERVAL
              value: "200ms"
            - name: OUTBOX_MAX_ATTEMPTS
              value: "100"
            - name: RELAY_METRICS_ADDR
              value: ":2113"
          ports: [{containerPort: 2113, name: metrics}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-relay
  namespace: order-lab
  labels:
    app: outbox-relay
spec:
  selector: {app: outbox-relay}
  ports:
    - {port: 2113, targetPort: 2113, name: metrics}
---
# EXP-09：consumer（Kafka → Inbox 去重 → 后置副作用）。单副本保序处理。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: consumer}
  template:
    metadata:
      labels: {app: consumer}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: consumer
          image: consumer:exp10a
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_DSN
              value: "flash:flash@tcp(mysql.order-lab.svc.cluster.local:3306)/flash?parseTime=true&timeout=2s&readTimeout=2s&writeTimeout=2s"
            - name: CONSUMER_DB_MAX_OPEN_CONNS
              value: "16"
            - name: CONSUMER_DB_MAX_IDLE_CONNS
              value: "8"
            - name: KAFKA_BROKERS
              value: "kafka.order-lab.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "orders"
            - name: CONSUMER_GROUP
              value: "order-consumer"
            - name: CONSUMER_METRICS_ADDR
              value: ":2114"
            # EXP-10 并发消费：8 worker + 16 在途上限（有界队列 = 反压）
            - name: CONSUMER_CONCURRENCY
              value: "8"
            - name: CONSUMER_MAX_INFLIGHT
              value: "16"
            # 攒批：一批事件一个事务（1 次 fsync），突破逐条事务 ~250/s 的串行墙
            - name: CONSUMER_BATCH_SIZE
              value: "50"
            - name: CONSUMER_BATCH_WAIT
              value: "10ms"
          ports: [{containerPort: 2114, name: metrics}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: order-lab
  labels:
    app: consumer
spec:
  selector: {app: consumer}
  ports:
    - {port: 2114, targetPort: 2114, name: metrics}
---
# EXP-13：order-api HPA（CPU 利用率指标，autoscaling/v2）。
# 预算约束（EXP-13 冻结，见连接预算表）：
#   - maxReplicas=5：MySQL max_connections=151，API 每副本 25 + relay 4 + consumer 16
#     → 5×25+20=145 ≤ 151；6 副本（170）会突破下游连接预算。
#   - CPU target 70% × requests 100m：requests 必须真实（EXP-05 冻结 100m），
#     指标来源 metrics-server；瓶颈若不在 CPU（本实验 P1 行锁/MySQL）时，
#     CPU HPA 只能保护计算资源，扩容收益受下游限制（EXP-13 实测结论）。
#   - 每副本限流 1500 rps（EXP-11 单实例预算）：集群总限流 = 副本数 × 1500。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-api
  namespace: order-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
# EXP-13：PDB——自愿中断（维护驱逐）时保证可用副本下限；不阻止硬故障与直接删除。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-api
  namespace: order-lab
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: order-api}
---
# EXP-12：dependency-simulator 可控依赖模拟器（非关键依赖）。
# 提供商品附加信息；/control 可实时注入慢响应/持续失败（实验组件，不承载真实数据）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-sim
  namespace: order-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: dep-sim}
  template:
    metadata:
      labels: {app: dep-sim}
    spec:
      containers:
        - name: dep-sim
          image: dependency-simulator:exp12a
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_ADDR
              value: ":8090"
          ports: [{containerPort: 8090}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8090}
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dep-sim
  namespace: order-lab
  labels:
    app: dep-sim
spec:
  selector: {app: dep-sim}
  ports:
    - {port: 8090, targetPort: 8090}
---
# ServiceMonitor：由 monitoring 命名空间的 Prometheus Operator 发现（release 标签匹配）。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-api
  namespace: order-lab
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: order-api}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: outbox-relay
  namespace: order-lab
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: outbox-relay}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: consumer
  namespace: order-lab
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app: consumer}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
---
# 告警规则：用户症状（错误率/延迟）＋容量（Pod CPU 节流）。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: order-api-alerts
  namespace: order-lab
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: order-api.rules
      rules:
        - alert: OrderAPIErrorRateHigh
          expr: |
            sum(rate(http_requests_total{route=~"/api/.*",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{route=~"/api/.*"}[5m])), 1) > 0.01
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "order-api 5xx 错误率超过 1%"
        - alert: OrderAPIP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_request_duration_seconds_bucket{route=~"/api/.*"}[5m]))
            ) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "order-api P99 延迟超过 500ms"
        - alert: OrderAPICPUThrottling
          expr: |
            sum(rate(container_cpu_cfs_throttled_periods_total{namespace="order-lab",pod=~"order-api-.*"}[5m]))
              / clamp_min(sum(rate(container_cpu_cfs_periods_total{namespace="order-lab",pod=~"order-api-.*"}[5m])), 1e-9) > 0.1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "order-api CPU 节流比例超过 10%"
        # EXP-09：事件链路告警——未投递事件保留并告警；Relay 停滞且有积压即告警。
        - alert: OutboxBacklogHigh
          expr: outbox_backlog > 10000
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Outbox 积压超过 10000 条，事件投递可能停滞"
        - alert: OutboxRelayNotDelivering
          expr: |
            outbox_backlog > 0
              and sum(rate(relay_sent_total[5m])) == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Outbox 有积压但 Relay 5 分钟内无成功投递"
        - alert: OutboxDeadEvents
          expr: increase(relay_dead_total[10m]) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "出现 DEAD 事件（超过最大尝试次数，需显式重放）"
        # EXP-10：Kafka 磁盘预算（PVC 2Gi 的 80%）与消费停滞告警
        - alert: KafkaDiskUsageHigh
          expr: |
            kubelet_volume_stats_used_bytes{namespace="order-lab",persistentvolumeclaim="kafka-data"}
              / kubelet_volume_stats_capacity_bytes{namespace="order-lab",persistentvolumeclaim="kafka-data"} > 0.8
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Kafka 数据卷用量超过 80%（保留期预算 1.5GiB 可能先触发删段）"
        - alert: ConsumerStalledWithBacklog
          expr: |
            outbox_backlog > 1000
              and sum(rate(consumer_processed_total[5m])) == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "事件有积压但 consumer 5 分钟内零处理（消费停滞）"
        # EXP-11：限流/过载/超时告警——准入控制拒绝是容量症状，不是系统错误本身，
        # 但持续高位说明流量已接近或超过预算，需要容量或扩容决策。
        - alert: OrderAPIRateLimitedHigh
          expr: |
            sum(rate(http_rate_limited_total[5m])) > 100
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "order-api 限流拒绝持续超过 100 req/s，流量超过单实例预算"
        - alert: OrderAPIInflightHigh
          expr: http_inflight > 0.8 * 200
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "order-api 在途请求数持续超过上限的 80%，接近过载拒绝边界"
        - alert: OrderAPIDeadlineHigh
          expr: |
            sum(rate(http_deadline_exceeded_total[5m]))
              / clamp_min(sum(rate(http_requests_total{route=~"/api/.*"}[5m])), 1) > 0.01
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "order-api 超总时间预算（504）的比例超过 1%，下游可能变慢"
        # EXP-12：非关键依赖熔断打开告警——降级可接受但需要被发现。
        - alert: DepCircuitOpen
          expr: dep_circuit_state{dep="product-extra"} == 1
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "商品附加信息依赖熔断打开超过 2 分钟（当前以降级响应服务）"
